name: GPUI Telegram Turbo CI

on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - "**.md"
      - "!docs/specs/**"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "!docs/specs/**"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: gpui-telegram-turbo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CI: "true"

jobs:
  ledger-parity-audit:
    name: Ledger Closure & Static Parity Audit (3,441 Upstream Files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run 6-Gate Source-File Parity Ledger Verification
        run: python3 scripts/verify_ledger_closure.py --ci-without-upstream --skip-cargo

  linux-fast-verify:
    name: Linux Turbo Check & Nextest (mold + sccache)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Linux APT Packages (mold + GPUI headers)
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ubuntu24-mold-gpui-v1
      - name: Install Linux Dependencies & mold Linker
        run: |
          PKGS="mold clang pkg-config protobuf-compiler libclang-dev libssl-dev libegl-dev libgl-dev libgles2-mesa-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev libdbus-1-dev libzstd-dev libsqlite3-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev libasound2-dev libfontconfig1-dev libfreetype6-dev"
          if [ -f ~/apt-cache/debs.tar.zst ]; then
            sudo tar --zstd -xf ~/apt-cache/debs.tar.zst -C /
            sudo apt-get install -y --no-install-recommends --no-upgrade $PKGS
          else
            mkdir -p ~/apt-cache
            sudo rm -f /var/cache/apt/archives/*.deb
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y -d --no-install-recommends $PKGS
            sudo tar --zstd -cf ~/apt-cache/debs.tar.zst /var/cache/apt/archives /var/lib/apt/lists
            sudo chown -R "$USER:$USER" ~/apt-cache
            sudo apt-get install -y --no-install-recommends $PKGS
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "ubuntu-24-turbo-v1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run Parallel Nextest & Workspace Binary Check on Linux
        run: |
          cargo nextest run --profile ci             -p gpui_telegram_core             -p gpui_telegram_proto             -p gpui_telegram_server             -p gpui_telegram_client             --lib
          cargo nextest run --profile ci             -p gpui_telegram_proto --test proto_tests --test api_rpc_endpoints_tests             -p gpui_telegram_server --test db_pts_messaging_tests --test server_routes_auth_tests             -p gpui_telegram_client --test auth_client_tests             -p gpui_telegram_desktop --test tdesktop_full_parity_integration_tests --test desktop_views_tests
          cargo check --workspace --lib --bins
      - name: Report sccache Hit Statistics & Clean Temp Garbage
        run: |
          sccache --show-stats || true
          python3 scripts/clean_build_garbage.py

  macos-gpui-verify:
    name: macOS Apple Silicon Turbo Check & Nextest (sccache)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Metal Toolchain & Protobuf
        run: |
          xcrun -sdk macosx metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          command -v protoc >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          command -v cmake >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "macos-15-turbo-v1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run Parallel Nextest & Workspace Binary Check on macOS
        run: |
          AI_GATEWAY_URL="http://127.0.0.1:9/api/ai/chat/stream" cargo nextest run --profile ci             -p gpui_telegram_core             -p gpui_telegram_proto             -p gpui_telegram_media             -p gpui_telegram_webrtc             -p gpui_telegram_agent             -p gpui_telegram_server             -p gpui_telegram_client             --lib
          AI_GATEWAY_URL="http://127.0.0.1:9/api/ai/chat/stream" cargo nextest run --profile ci             -p gpui_telegram_proto --test proto_tests --test api_rpc_endpoints_tests             -p gpui_telegram_media --test waveform_5bit_codec_roundtrip             -p gpui_telegram_agent --test agent_runtime_tests --test mcp_cua_talk_tests             -p gpui_telegram_server --test db_pts_messaging_tests --test server_routes_auth_tests             -p gpui_telegram_client --test auth_client_tests             -p gpui_telegram_desktop               --test tdesktop_full_parity_integration_tests               --test desktop_views_tests               --test auth_wizard_tabs_tests               --test dialogs_widget_subsystem_tests               --test window_themes_subsystem_tests               --test milestone_1_nav_calls_regression_tests               --test milestone_3_settings_regression_tests
          cargo check --workspace --lib --bins
          cargo build --profile ci --bin gpui_telegram_desktop
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-telegram-desktop-macos-arm64-fast
          path: target/ci/gpui_telegram_desktop
          retention-days: 7
      - name: Report sccache Hit Statistics & Clean Temp Garbage
        run: |
          sccache --show-stats || true
          python3 scripts/clean_build_garbage.py
